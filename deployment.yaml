apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-k8s-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-k8s
  template:
    metadata:
      labels:
        app: flask-k8s
    spec:
      containers:
        - name: flask-container
          image: flask-k8s-app
          ports:
            - containerPort: 5000
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: flask-config
                  key: MESSAGE
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flask-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: flask-storage
              mountPath: /data
      volumes:
        - name: flask-storage
          persistentVolumeClaim:
            claimName: flask-pvc
